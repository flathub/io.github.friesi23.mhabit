# yaml-language-server: $schema=https://raw.githubusercontent.com/flatpak/flatpak-builder/main/data/flatpak-manifest.schema.json

---
app-id: io.github.friesi23.mhabit
runtime: org.freedesktop.Sdk
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm22
command: mhabit
separate-locales: false
finish-args:
  - --share=network
  - --share=ipc
  - --device=dri
  - --socket=fallback-x11
  - --socket=wayland
  - --talk-name=org.freedesktop.Notifications
  # To check connectivity, required by package: https://pub.dev/packages/connectivity_plus
  - --system-talk-name=org.freedesktop.NetworkManager
modules:
  - name: jsoncpp
    buildsystem: meson
    config-opts:
      - --buildtype=release
      - --default-library=shared
    sources:
      - type: archive
        url: https://github.com/open-source-parsers/jsoncpp/archive/refs/tags/1.9.6.tar.gz
        sha256: f93b6dd7ce796b13d02c108bc9f79812245a82e577581c4c9aabe57075c90ea2
    cleanup:
      - "/lib/*.a"
      - "/include"
  # Bundle the CJK font that the app registers with Flutter at startup.
  - name: noto-sans-cjk
    buildsystem: simple
    build-commands:
      - install -Dm644 NotoSansCJKsc-Regular.otf /app/share/fonts/NotoSansCJKsc-Regular.otf
      - install -Dm644 NotoSansCJK.LICENSE.txt /app/share/licenses/${FLATPAK_ID}/NotoSansCJK.LICENSE.txt
      - fc-cache -f /app/share/fonts
      - fc-match -f '%{file}\n' 'Noto Sans CJK SC' | grep -Fx /app/share/fonts/NotoSansCJKsc-Regular.otf
    sources:
      - type: file
        url: https://cdn.jsdelivr.net/gh/notofonts/noto-cjk@Sans2.004/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf
        sha256: 2c76254f6fc379fddfce0a7e84fb5385bb135d3e399294f6eeb6680d0365b74b
      - type: file
        url: https://cdn.jsdelivr.net/gh/notofonts/noto-cjk@Sans2.004/LICENSE
        sha256: 6a73f9541c2de74158c0e7cf6b0a58ef774f5a780bf191f2d7ec9cc53efe2bf2
        dest-filename: NotoSansCJK.LICENSE.txt
  - name: mhabit
    buildsystem: simple
    build-options:
      arch:
        x86_64:
          env:
            BUNDLE_PATH: build/linux/x64/release/bundle
        aarch64:
          env:
            BUNDLE_PATH: build/linux/arm64/release/bundle
      append-path: /usr/lib/sdk/llvm22/bin:/run/build/mhabit/flutter/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm22/lib
      env:
        PUB_CACHE: /run/build/mhabit/.pub-cache
    build-commands:
      - flutter build linux --release --no-pub --dart-define=APP_DISTRIBUTION=flathub
      - sh flatpak/install-linux-bundle.sh "$BUNDLE_PATH"
      - install -Dm644 assets/logo/macos.svg /app/share/icons/hicolor/scalable/apps/io.github.friesi23.mhabit.svg
      - install -Dm644 flatpak/io.github.friesi23.mhabit.metainfo.xml -t /app/share/metainfo
      - install -Dm644 flatpak/io.github.friesi23.mhabit.desktop -t /app/share/applications
    sources:
      - type: git
        url: https://github.com/FriesI23/mhabit.git
        tag: v1.27.25+214
        commit: bbaad4d3f8380e0fc7d8d74cd1fdbde803338569
        disable-submodules: true
      - type: git
        url: https://github.com/flutter/flutter.git
        tag: 3.47.9
        dest: flutter
      - type: file
        path: scripts/install-linux-bundle.sh
        dest: flatpak
